{% if site.form_endpoint != "" %}
<form class="katz-form" method="post" action="{{ site.form_endpoint }}" data-success="Thank you. We will reply within a few working days." novalidate>
<input type="hidden" name="form_type" value="advertising">
<input type="hidden" name="elapsed" value="nojs">
<div class="hp" aria-hidden="true"><label>Leave this empty <input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
<fieldset><legend>About you</legend>
<label>Name <span class="req">Required</span><input type="text" name="name" required autocomplete="name" maxlength="120"></label>
<label>Organization <span class="req">Required</span><input type="text" name="organization" required autocomplete="organization" maxlength="160"></label>
<label>Email <span class="req">Required</span><input type="email" name="email" required autocomplete="email" maxlength="200"></label>
<label>Phone <span class="opt">Optional</span><input type="tel" name="phone" autocomplete="tel" maxlength="40"></label>
</fieldset>
<label>Website <span class="opt">Optional</span><input type="url" name="company_website" maxlength="300"></label>
<fieldset><legend>Your campaign</legend>
<label>What would you like to promote? <span class="req">Required</span><textarea name="promote" rows="3" required maxlength="1500"></textarea></label>
<p class="label">Formats you're interested in</p>
<label class="check"><input type="checkbox" name="format_newsletter" value="yes"> Newsletter sponsorship</label>
<label class="check"><input type="checkbox" name="format_banner" value="yes"> Website banner</label>
<label class="check"><input type="checkbox" name="format_sponsored" value="yes"> Sponsored article (clearly labelled)</label>
<label class="check"><input type="checkbox" name="format_event" value="yes"> Event partnership</label>
<label>Audience you want to reach <select name="section"><option>All readers</option><option>Frontier Science</option><option>Emerging Technologies</option><option>Education and Upskilling</option><option>Entrepreneurship</option></select></label>
<label>Budget range <select name="budget"><option>Not sure yet</option><option>Under €500</option><option>€500–2,000</option><option>€2,000–10,000</option><option>Over €10,000</option></select></label>
<label>Preferred timing <span class="opt">Optional</span><input type="text" name="timing" maxlength="200"></label>
</fieldset>
<label class="check"><input type="checkbox" name="accept_policy" value="yes" required> I understand that advertising never influences KATZ's reporting and is always labelled. <span class="req">Required</span></label>
<label class="check"><input type="checkbox" name="consent_privacy" value="yes" required> I accept the <a href="/privacy/">privacy notice</a>. <span class="req">Required</span></label>
<button type="submit" class="button">Send enquiry</button>
<p class="form-status" role="status" aria-live="polite"></p>
</form>
{% else %}
<p class="form-closed">This form opens soon. Until then, email <a href="mailto:ads@katz.news">ads@katz.news</a>.</p>
{% endif %}
<script src="/assets/js/forms.js" defer></script>
