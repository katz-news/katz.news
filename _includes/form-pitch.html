{% if site.form_endpoint != "" %}
<form class="katz-form" method="post" action="{{ site.form_endpoint }}" data-success="Thank you. We reply to every pitch within 48 hours." novalidate>
<input type="hidden" name="form_type" value="pitch">
<input type="hidden" name="elapsed" value="nojs">
<div class="hp" aria-hidden="true"><label>Leave this empty <input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
<fieldset><legend>About you</legend>
<label>Name <span class="req">Required</span><input type="text" name="name" required autocomplete="name" maxlength="120"></label>
<label>Email <span class="req">Required</span><input type="email" name="email" required autocomplete="email" maxlength="200"></label>
<label>You are <select name="role"><option>Student</option><option>Alumnus or alumna</option><option>KBI member</option><option>Professional</option><option>Other</option></select></label>
</fieldset>
<fieldset><legend>Your story</legend>
<label>Section <select name="section"><option>Frontier Science</option><option>Emerging Technologies</option><option>Education and Upskilling</option><option>Entrepreneurship</option><option>Not sure</option></select></label>
<label>Type <select name="type"><option>News</option><option>Explainer</option><option>Profile</option><option>Guide</option><option>Opinion</option></select></label>
<label>Working headline <span class="opt">Optional</span><input type="text" name="headline" maxlength="160"></label>
<label>Your angle in one sentence <span class="req">Required</span><textarea name="angle" rows="2" required maxlength="400"></textarea></label>
<label>Why you, and why now <span class="opt">Optional</span><textarea name="why" rows="3" maxlength="1500"></textarea></label>
<label>Main sources, as links <span class="req">Required</span><textarea name="sources" rows="3" required maxlength="2000"></textarea></label>
<label>Any conflict of interest? Write "None" if none. <span class="req">Required</span><input type="text" name="conflicts" required maxlength="400"></label>
<label>Will you use AI? If yes, how? <span class="opt">Optional</span><input type="text" name="ai_use" maxlength="400" placeholder="No"></label>
</fieldset>
<fieldset><legend>Are you under 16?</legend>
<label class="check"><input type="radio" name="under_16" value="no" checked> No</label>
<label class="check"><input type="radio" name="under_16" value="yes"> Yes</label>
<div class="guardian">
<label>Parent or guardian's name <input type="text" name="guardian_name" maxlength="120"></label>
<label>Parent or guardian's email <input type="email" name="guardian_email" maxlength="200"></label>
</div>
</fieldset>
<label class="check"><input type="checkbox" name="consent_terms" value="yes" required> I have read the <a href="/contribute/">Contribute</a> page and accept its terms. <span class="req">Required</span></label>
<label class="check"><input type="checkbox" name="consent_privacy" value="yes" required> I accept the <a href="/privacy/">privacy notice</a>. <span class="req">Required</span></label>
<button type="submit" class="button">Send pitch</button>
<p class="form-status" role="status" aria-live="polite"></p>
</form>
{% else %}
<p class="form-closed">This form opens soon. Until then, email <a href="mailto:pitching@katz.news">pitching@katz.news</a>.</p>
{% endif %}
<script src="/assets/js/forms.js" defer></script>
